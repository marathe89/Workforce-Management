# --- Port 80: redirect the real domain to HTTPS, but serve the app
#     directly (no redirect) when reached by bare IP — no TLS cert
#     exists for a raw IP, so redirecting it too would break it.
server {
    listen 80;
    listen [::]:80;
    server_name workforceintelligence.amitmarathe.com 189.72.144.75;

    if ($host = workforceintelligence.amitmarathe.com) {
        return 301 https://$host$request_uri;
    }

    root /var/www/workforce-intelligence/frontend;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Port 443: HTTPS for the real domain (cert only covers this hostname)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name workforceintelligence.amitmarathe.com;

    ssl_certificate /etc/letsencrypt/live/workforceintelligence.amitmarathe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workforceintelligence.amitmarathe.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/workforce-intelligence/frontend;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
