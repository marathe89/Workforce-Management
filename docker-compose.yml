version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: workforce_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workforce_intelligence
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workforce_api
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: workforce_intelligence
      PORT: 5000
      NODE_ENV: development
      JWT_SECRET: dev-secret-key
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FRONTEND_URL: http://localhost:3000
    ports:
      - '5001:5000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./workforce-schema.sql:/workforce-schema.sql:ro
    command: sh -c "npm run migrate && npm run seed && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workforce_ui
    # VITE_API_URL is a build-time value (Vite inlines it), not a runtime
    # env var — it has no effect set here. It defaults to '/api' in
    # frontend/Dockerfile, which nginx.conf proxies to the backend container.
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
